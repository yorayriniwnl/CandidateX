<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">CandidateX evidence flow and research/live mode boundaries</title>
  <desc id="desc">The synthetic research demo selects fixed simulated observations without fetching external sources. A separate live-analysis prototype accepts candidate-supplied documents and selected public URLs, performs bounded extraction and static inspection without executing candidate code, then records provenance-bearing observations. Both paths feed a role-aware view where unobserved evidence remains unknown, a dossier and interview probes, and a human interviewer. CandidateX never makes autonomous hire or reject decisions, and employment accuracy is not validated.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#351016" stroke-width="1" opacity=".38"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8f0014"/>
      <stop offset="1" stop-color="#ff1f2d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6670"/>
    </marker>
    <style>
      .display { font-family: 'Cormorant Garamond', Georgia, serif; }
      .mono { font-family: 'DM Mono', 'Courier New', monospace; }
      .body { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="720" rx="24" fill="#050505"/>
  <rect width="1600" height="720" rx="24" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="720" rx="4" fill="url(#accent)"/>
  <text x="44" y="58" class="mono" font-size="14" letter-spacing="3" fill="#ff6670">YOR // CANDIDATEX</text>
  <text x="44" y="112" class="display" font-size="38" font-weight="700" fill="#fff5f5">Evidence in. Uncertainty stays visible.</text>
  <text x="44" y="151" class="body" font-size="17" fill="#d2a1a7">Two clearly separated paths converge on explainable evidence and human review.</text>
  <rect x="1290" y="42" width="266" height="40" rx="20" fill="#16070a" stroke="#8f0014"/>
  <circle cx="1312" cy="62" r="5" fill="#ff1f2d"/>
  <text x="1328" y="67" class="mono" font-size="12" letter-spacing="1.2" fill="#fff5f5">RESEARCH / LIVE BOUNDARY</text>

  <!-- Step 1: two explicitly different input paths. -->
  <g>
    <rect x="40" y="205" width="212" height="330" rx="16" fill="#090707" stroke="#54202a" stroke-width="1.5"/>
    <rect x="40" y="205" width="212" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="58" y="239" class="mono" font-size="12" letter-spacing="1.5" fill="#ff6670">01 / ENTRY PATHS</text>
    <rect x="56" y="260" width="180" height="112" rx="11" fill="#12080b" stroke="#67202a"/>
    <text x="70" y="284" class="mono" font-size="10" letter-spacing="1" fill="#ff6670">SYNTHETIC ONLY</text>
    <text x="70" y="310" class="body" font-size="15" font-weight="700" fill="#fff5f5">/research-demo</text>
    <text x="70" y="334" class="body" font-size="12" fill="#d2a1a7">Fixed simulated observations.</text>
    <text x="70" y="353" class="body" font-size="12" fill="#d2a1a7">No external source fetch.</text>
    <rect x="56" y="386" width="180" height="130" rx="11" fill="#0c0a0a" stroke="#3e2629"/>
    <text x="70" y="411" class="mono" font-size="10" letter-spacing="1" fill="#ff6670">SEPARATE PROTOTYPE</text>
    <text x="70" y="437" class="body" font-size="15" font-weight="700" fill="#fff5f5">/analyze</text>
    <text x="70" y="461" class="body" font-size="12" fill="#d2a1a7">Candidate-supplied files</text>
    <text x="70" y="480" class="body" font-size="12" fill="#d2a1a7">and selected public URLs.</text>
    <text x="70" y="501" class="mono" font-size="9" letter-spacing=".8" fill="#a9757c">NO REAL CVs</text>
  </g>

  <!-- Step 2: behavior differs by mode; neither lane is presented as universal. -->
  <g>
    <rect x="285" y="205" width="255" height="330" rx="16" fill="#090707" stroke="#54202a" stroke-width="1.5"/>
    <rect x="285" y="205" width="255" height="5" rx="2.5" fill="#8f0014"/>
    <text x="303" y="239" class="mono" font-size="12" letter-spacing="1.2" fill="#ff6670">02 / MODE-SPECIFIC INTAKE</text>
    <rect x="301" y="260" width="223" height="112" rx="11" fill="#12080b" stroke="#67202a"/>
    <text x="315" y="285" class="mono" font-size="10" letter-spacing="1" fill="#ff6670">RESEARCH SCENARIO</text>
    <text x="315" y="312" class="body" font-size="13" fill="#fff5f5">Selects fixed fixture</text>
    <text x="315" y="332" class="body" font-size="13" fill="#fff5f5">observations for the demo.</text>
    <rect x="301" y="386" width="223" height="130" rx="11" fill="#0c0a0a" stroke="#3e2629"/>
    <text x="315" y="411" class="mono" font-size="10" letter-spacing="1" fill="#ff6670">LIVE-ANALYSIS PATH</text>
    <text x="315" y="438" class="body" font-size="12" fill="#fff5f5">Bounded document and source</text>
    <text x="315" y="457" class="body" font-size="12" fill="#fff5f5">inspection; code is analyzed</text>
    <text x="315" y="476" class="body" font-size="12" fill="#fff5f5">statically and never executed.</text>
    <text x="315" y="501" class="mono" font-size="9" letter-spacing=".7" fill="#a9757c">USER SELECTS SOURCES</text>
  </g>

  <!-- Shared output and review stages. -->
  <g>
    <rect x="575" y="205" width="220" height="330" rx="16" fill="#090707" stroke="#54202a" stroke-width="1.5"/>
    <rect x="575" y="205" width="220" height="5" rx="2.5" fill="#8f0014"/>
    <text x="593" y="239" class="mono" font-size="12" letter-spacing="1.2" fill="#ff6670">03 / PROVENANCE</text>
    <circle cx="685" cy="316" r="34" fill="#17080c" stroke="#ff1f2d" stroke-width="1.5"/>
    <path d="M671 316l9 9 20-22" fill="none" stroke="#ff6670" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="593" y="383" class="body" font-size="15" font-weight="700" fill="#fff5f5">Traceable observations</text>
    <text x="593" y="414" class="body" font-size="12" fill="#d2a1a7">Source locators</text>
    <text x="593" y="436" class="body" font-size="12" fill="#d2a1a7">Content fingerprints</text>
    <text x="593" y="458" class="body" font-size="12" fill="#d2a1a7">Extractor / analyzer versions</text>
    <text x="593" y="480" class="body" font-size="12" fill="#d2a1a7">Confidence factors</text>
  </g>
  <g>
    <rect x="830" y="205" width="240" height="330" rx="16" fill="#090707" stroke="#54202a" stroke-width="1.5"/>
    <rect x="830" y="205" width="240" height="5" rx="2.5" fill="#8f0014"/>
    <text x="848" y="239" class="mono" font-size="12" letter-spacing="1.1" fill="#ff6670">04 / ROLE-AWARE VIEW</text>
    <text x="848" y="299" class="display" font-size="20" font-weight="700" fill="#fff5f5">Observed ≠ complete</text>
    <rect x="848" y="321" width="204" height="63" rx="10" fill="#12080b" stroke="#67202a"/>
    <text x="863" y="347" class="mono" font-size="11" fill="#ff6670">RCI</text>
    <text x="863" y="368" class="body" font-size="12" fill="#fff5f5">Observed capabilities only</text>
    <rect x="848" y="398" width="204" height="82" rx="10" fill="#0c0a0a" stroke="#3e2629"/>
    <text x="863" y="424" class="mono" font-size="11" fill="#ff6670">EVIDENCE COVERAGE</text>
    <text x="863" y="448" class="body" font-size="12" fill="#fff5f5">Missing evidence remains</text>
    <text x="863" y="468" class="mono" font-size="13" font-weight="700" fill="#ff6670">UNKNOWN</text>
  </g>
  <g>
    <rect x="1110" y="205" width="230" height="330" rx="16" fill="#090707" stroke="#54202a" stroke-width="1.5"/>
    <rect x="1110" y="205" width="230" height="5" rx="2.5" fill="#8f0014"/>
    <text x="1128" y="239" class="mono" font-size="12" letter-spacing="1.1" fill="#ff6670">05 / REVIEW MATERIAL</text>
    <text x="1128" y="300" class="display" font-size="20" font-weight="700" fill="#fff5f5">Dossier + probes</text>
    <text x="1128" y="346" class="body" font-size="13" fill="#d2a1a7">Evidence, conflicts,</text>
    <text x="1128" y="368" class="body" font-size="13" fill="#d2a1a7">and uncertainty stay</text>
    <text x="1128" y="390" class="body" font-size="13" fill="#d2a1a7">inspectable.</text>
    <path d="M1130 424h185" stroke="#54202a"/>
    <text x="1128" y="455" class="body" font-size="12" fill="#fff5f5">Focused questions direct</text>
    <text x="1128" y="475" class="body" font-size="12" fill="#fff5f5">the next human review.</text>
  </g>
  <g>
    <rect x="1375" y="205" width="185" height="330" rx="16" fill="#100608" stroke="#8f0014" stroke-width="1.5"/>
    <rect x="1375" y="205" width="185" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="1393" y="239" class="mono" font-size="12" letter-spacing="1.1" fill="#ff6670">06 / HUMAN</text>
    <circle cx="1467" cy="327" r="39" fill="#17080c" stroke="#8f0014" stroke-width="1.5"/>
    <path d="M1452 328c0-8 6-14 15-14s15 6 15 14v5h-30zM1449 362c2-13 9-20 18-20s16 7 18 20" fill="none" stroke="#ff6670" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1393" y="405" class="body" font-size="14" font-weight="700" fill="#fff5f5">Interviewer</text>
    <text x="1393" y="437" class="body" font-size="12" fill="#d2a1a7">Reviews context,</text>
    <text x="1393" y="457" class="body" font-size="12" fill="#d2a1a7">asks the questions,</text>
    <text x="1393" y="477" class="body" font-size="12" fill="#d2a1a7">makes the decision.</text>
  </g>

  <!-- Sequence arrows. -->
  <g fill="none" stroke="#ff6670" stroke-width="2" marker-end="url(#arrow)" opacity=".95">
    <path d="M252 370h25"/>
    <path d="M540 370h28"/>
    <path d="M795 370h31"/>
    <path d="M1070 370h36"/>
    <path d="M1340 370h31"/>
  </g>

  <rect x="40" y="582" width="1520" height="83" rx="15" fill="#100608" stroke="#54202a"/>
  <rect x="40" y="582" width="5" height="83" rx="2.5" fill="#ff1f2d"/>
  <text x="68" y="616" class="mono" font-size="12" letter-spacing="1.8" fill="#ff6670">HUMAN OVERSIGHT</text>
  <text x="68" y="643" class="body" font-size="16" fill="#fff5f5">CandidateX never makes autonomous hire / reject decisions. Results have not been validated for employment decisions.</text>
  <text x="1538" y="697" text-anchor="end" class="mono" font-size="10" letter-spacing="1" fill="#a9757c">SYNTHETIC DEMO ≠ LIVE ACQUISITION</text>
</svg>
