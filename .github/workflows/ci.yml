name: CCI CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          cd services/backend
          pip install -e ".[dev]"

      - name: Run Backend Test Suite (Pytest)
        run: |
          cd services/backend
          pytest -v --durations=10

  frontend-check:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js Linter & Typecheck
        run: pnpm --filter web lint

      - name: Next.js Production Build
        run: pnpm --filter web build

  security-and-invariants:
    name: Paper Invariants & SSRF Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          cd services/backend
          pip install -e ".[dev]"

      - name: Run SSRF & IMDS Protection Tests
        run: |
          cd services/backend
          pytest tests/security/test_ssrf.py tests/security/repositories/test_safe_workspace.py -v

      - name: Run Formal Math Calibration & Theorem Audit (Theorems 1-10)
        run: |
          cd services/backend
          pytest tests/unit/scoring/ tests/test_paper_theorems_audit.py -v

      - name: Run Research Simulation Quick Sanity Check
        run: |
          python research/run_paper_experiments.py --quick

      - name: Verify Database Repository & Seeding CLI
        run: |
          cd services/backend
          pytest tests/integration/test_db_seeding.py -v
          python ../../scripts/seed_db.py --db-url "sqlite:///ci_test.db" --reset --samples 2
          rm -f ci_test.db

      - name: Audit Invariant: No Untrusted Code Execution
        run: |
          # Verify that candidate files are never executed via eval/exec/subprocess in analyzers
          ! grep -rnE "exec\(|eval\(" services/backend/src/cci/analyzers/
          ! grep -rnE "subprocess\.run\([a-zA-Z0-9_]*candidate" services/backend/src/cci/
