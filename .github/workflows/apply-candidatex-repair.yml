name: Apply CandidateX repaired snapshot

on:
  push:
    branches:
      - chatgpt/candidatex-final-repair-20260918
    paths:
      - '.candidatex_repair/**'
      - '.github/workflows/apply-candidatex-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/candidatex-final-repair-20260918
          fetch-depth: 0

      - name: Reconstruct and verify repair payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .candidatex_repair/chunk01.b64 \
            .candidatex_repair/chunk02.b64 \
            .candidatex_repair/chunk03.b64 \
            .candidatex_repair/chunk04.b64 \
            .candidatex_repair/chunk05.b64 \
            .candidatex_repair/chunk06a.b64 \
            .candidatex_repair/chunk06b.b64 \
            .candidatex_repair/chunk06c.b64 \
            .candidatex_repair/chunk06d.b64 \
            .candidatex_repair/chunk06e.b64 \
            > /tmp/candidatex-delta.tar.gz.b64
          actual_len="$(wc -c < /tmp/candidatex-delta.tar.gz.b64 | tr -d ' ')"
          test "$actual_len" = "292908" || { echo "Payload length mismatch: $actual_len"; exit 1; }
          base64 -d /tmp/candidatex-delta.tar.gz.b64 > /tmp/candidatex-delta.tar.gz
          echo "ebed575b3eb0c6b4af90e6c167cb7edd948eaf3ca54503ff5235621db991ff5d  /tmp/candidatex-delta.tar.gz" | sha256sum -c -
          mkdir /tmp/candidatex-delta
          tar -xzf /tmp/candidatex-delta.tar.gz -C /tmp/candidatex-delta

      - name: Apply exact source delta
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.candidatex_delete_manifest' /tmp/candidatex-delta/ ./
          rm -f apps/web/package-lock.json
          rm -f apps/web/data/mockDossier.ts
          rm -rf .candidatex_repair
          rm -f .github/workflows/apply-candidatex-repair.yml

      - name: Commit repaired source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were produced; refusing to create an empty repair commit."
            exit 1
          fi
          git commit -m "fix: complete CandidateX evidence integrity and production hardening"
          git push origin HEAD:chatgpt/candidatex-final-repair-20260918
