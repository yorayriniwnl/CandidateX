name: CandidateX Frontend Snapshot Verify

on:
  push:
    branches: [candidatex-audit-verify-20260918]

permissions:
  contents: write

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact audited snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .candidatex-sync/part* > /tmp/frontend-sync.b64
          echo "6e5c0ad284207ec6d5453d129fceb6d1e58ba6b015fb64b6003910b043b1c13c  /tmp/frontend-sync.b64" | sha256sum -c -
          base64 --decode /tmp/frontend-sync.b64 > /tmp/frontend-sync.tgz
          echo "8147a51de6eb7944e355483cca6299f9160eea6255b474dd5165123c9c8358b9  /tmp/frontend-sync.tgz" | sha256sum -c -
          tar -xzf /tmp/frontend-sync.tgz -C .
          rm -f package-lock.json apps/web/data/mockDossier.ts
          rm -rf .candidatex-sync
          rm -f .github/workflows/frontend-sync-verify.yml

      - name: Materialize checksum-verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix(web): materialize audited frontend snapshot"
            git push origin HEAD:candidatex-audit-verify-20260918
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend source integrity tests
        run: pnpm --filter web test

      - name: TypeScript syntax and relative import audit
        run: pnpm --filter web syntaxcheck

      - name: TypeScript typecheck
        run: pnpm --filter web lint

      - name: Next.js production build
        run: pnpm --filter web build
