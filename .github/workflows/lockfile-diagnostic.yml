name: Lockfile diagnostic

on:
  push:
    branches:
      - fix/restore-main-ci-20260930

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate and show lockfile delta
        run: |
          pnpm install --no-frozen-lockfile
          echo "===== GENERATED LOCKFILE DIFF ====="
          git diff -- pnpm-lock.yaml
