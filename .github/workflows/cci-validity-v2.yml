name: CCI Validity V2 - Synthetic Research

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/backend/src/cci/research/simulation.py'
      - 'services/backend/tests/unit/research/**'
      - 'research/run_validity_v2.py'
      - 'research/VALIDATION_V2_PROTOCOL.md'
      - '.github/workflows/cci-validity-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/backend/pyproject.toml'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/backend[dev]"
      - name: Research integrity and protocol tests
        run: |
          python -m pytest services/backend/tests/unit/research/test_synthetic_generator_integrity.py services/backend/tests/unit/research/test_validity_v2.py -v
      - name: Run full 4,800-case corrected synthetic study
        run: |
          python research/run_validity_v2.py --output reports/ci_validity_v2.json
      - name: Validate and print complete results
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p = Path("reports/ci_validity_v2.json")
          data = json.loads(p.read_text())
          assert data["simulated_instances"] == 4800
          assert data["invalid_non_github_fork_observations"] == 0
          for name, row in data["results"].items():
              if name.startswith("FULL_MINUS_"):
                  values = [row["mean_seed_difference"], *row["seed_block_95ci"]]
              else:
                  assert row["sample_count"] == 4800
                  values = [row["rci_mae"], row["rci_rmse"], row["capability_mae"],
                            row["spearman_rho"], *row["rci_mae_95ci_seed_bootstrap"]]
              assert all(math.isfinite(v) for v in values), name
          print(json.dumps(data, indent=2))
          PY
      - name: Preserve independent v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cci-validity-v2-synthetic-results
          path: reports/ci_validity_v2.json
          if-no-files-found: error
